  frontend:
    build:
      context: ..
      dockerfile: Contenedores/Contenedor - frontend/Dockerfile
    container_name: libro-clases-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8050}:80"
    depends_on:
      auth-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      academico-api:
        condition: service_healthy
      asistencia-api:
        condition: service_healthy
      conducta-api:
        condition: service_healthy
      mensajeria-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M

volumes:
  postgres-colegio-data:
