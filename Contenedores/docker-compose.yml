    container_name: asistencia-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8054:8054"
    environment:
      SERVER_PORT: 8054
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_asistencia
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-UnaClaveSuperSecretaYMuyLargaParaPoderFirmarElTokenCorrectamente12345}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      MS_ADMINISTRACION_BASE_URL: http://admin-api:8052
      MS_MENSAJERIA_BASE_URL: http://mensajeria-api:8056
    depends_on:
      postgres:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8054/actuator/health | grep -q UP"]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 448M
        reservations:
          cpus: "0.10"
          memory: 224M

  conducta-api:
    build:
      context: ..
      dockerfile: Contenedores/Contenedor - ms_conducta/Dockerfile
    container_name: conducta-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8055:8055"
    environment:
      SERVER_PORT: 8055
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_conducta
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-UnaClaveSuperSecretaYMuyLargaParaPoderFirmarElTokenCorrectamente12345}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      MS_ADMINISTRACION_BASE_URL: http://admin-api:8052
      MS_AUTENTICACION_BASE_URL: http://auth-api:8051
      MS_MENSAJERIA_BASE_URL: http://mensajeria-api:8056
    depends_on:
      postgres:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      auth-api:
        condition: service_healthy
      mensajeria-api:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8055/actuator/health | grep -q UP"]
    deploy:
