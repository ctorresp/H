services:
  auth-api:
    # Contexto = carpeta Contenedor - ms_auth (donde están el Dockerfile y el JAR compilado)
    build:
      context: ./Contenedor - ms_auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8080:8081"
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/db_usuarios?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql-auth
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=db_usuarios
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-auth-data:/var/lib/mysql

volumes:
  mysql-auth-data: