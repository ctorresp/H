# Libro de Clases Digital — Colegio Bernardo O'Higgins (Coquimbo)
# Despliegue productivo con límites estrictos de CPU/RAM y frontend integrado.
#
# Uso:
#   cd H/Contenedores
#   docker compose up -d --build
#
# Acceso: http://127.0.0.1:8050 (frontend nginx — frontend-bo del repo GitHub)
# APIs: 8051 (auth) … 8056 (mensajería)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-health: &api-health
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: always
    container_name: postgres-colegio-boh
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-colegio-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M

  auth-api:
    build:
      context: ..
      dockerfile: Contenedores/Contenedor - ms_auth/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8051:8051"
    environment:
      SERVER_PORT: 8051
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuarios
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-UnaClaveSuperSecretaYMuyLargaParaPoderFirmarElTokenCorrectamente12345}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      APP_ADMIN_ENABLED: "true"
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL:-admin@boh.cl}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:-Admin123!}"
      MS_ADMINISTRACION_BASE_URL: http://admin-api:8052
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8051/actuator/health | grep -q UP"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M

  admin-api:
    build:
      context: ..
      dockerfile: Contenedores/Contenedor - ms_administracion/Dockerfile
    container_name: admin-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8052:8052"
    environment:
      SERVER_PORT: 8052
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_administracion
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-UnaClaveSuperSecretaYMuyLargaParaPoderFirmarElTokenCorrectamente12345}
      MS_AUTH_BASE_URL: http://auth-api:8051
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8052/actuator/health | grep -q UP"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.20"
          memory: 384M

  academico-api:
    build:
      context: ..
      dockerfile: Contenedores/Contenedor - ms_academico/Dockerfile
    container_name: academico-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8053:8053"
    environment:
      SERVER_PORT: 8053
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_academico
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-UnaClaveSuperSecretaYMuyLargaParaPoderFirmarElTokenCorrectamente12345}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      MS_ADMINISTRACION_BASE_URL: http://admin-api:8052
      MS_MENSAJERIA_BASE_URL: http://mensajeria-api:8056
    depends_on:
      postgres:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      <<: *api-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8053/actuator/health | grep -q UP"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.15"
          memory: 256M

  asistencia-api:
