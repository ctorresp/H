<div class="view-container fade-in">
  
  <div class="register-header-actions">
    <a class="back-link" (click)="volver()">← Volver a mis cursos</a>
  </div>

  <div class="register-topbar">
    <div class="register-titles">
      <h2>Registro de Asistencia</h2>
      <p>Curso: <strong class="text-highlight">{{ idCurso }}</strong> • Asignatura Asignada</p>
    </div>
    <div class="register-controls">
      <input type="text" class="date-input" [value]="fechaActual" readonly>
      <button class="btn-primary" (click)="guardarAsistencia()">Guardar Asistencia</button>
    </div>
  </div>

  <div class="content-card">
    <table class="attendance-table">
      <thead>
        <tr>
          <th width="5%">N°</th>
          <th width="35%">ALUMNO</th>
          <th width="20%" class="text-center">PRESENTE</th>
          <th width="20%" class="text-center">AUSENTE</th>
          <th width="20%" class="text-center">ATRASADO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of alumnos; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="student-name">{{ alumno.nombre }}</td>
          
          <td class="text-center">
            <input type="radio" [name]="'estado_'+alumno.id" value="presente" [checked]="alumno.estado === 'presente'">
          </td>
          <td class="text-center">
            <input type="radio" [name]="'estado_'+alumno.id" value="ausente" [checked]="alumno.estado === 'ausente'">
          </td>
          <td class="text-center">
            <input type="radio" [name]="'estado_'+alumno.id" value="atrasado" [checked]="alumno.estado === 'atrasado'">
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
