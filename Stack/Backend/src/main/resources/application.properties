spring.application.name=auth
# Configuración del puerto del microservicio (usualmente el Auth corre en 8080 o 8081)
server.port=8081

# Conexión a Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave secreta para firmar el JWT (En producción esto va en variables de entorno)
jwt.secret=UnaClaveSuperSecretaYMuyLargaParaPoderFirmarElTokenCorrectamente12345
jwt.expiration=86400000 
# (Expiración en milisegundos: 86400000 = 1 día)